# Instruction counts for the SNTPv4 packet codec.
#
# A deterministic counter, not a clock: the house rule is that the counter is
# the verdict and the clock is confirmatory, and on a workload this small a
# clock measures the box.
[package]
name = "sntp-ir"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
rusty_rtos_sntp-core = { path = "../../crates/rusty_rtos_sntp-core", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = true

[workspace]
